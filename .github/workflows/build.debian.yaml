name: build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - image: debian-13-golden
            dir: debian-13-golden
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./scripts/build.sh ${{ matrix.dir }}
      - name: Publish
        run: ./scripts/publish.sh ${{ matrix.image }} ${{ matrix.dir }}/output/${{ matrix.dir }}.qcow2
