name: build
on:
  workflow_dispatch:

concurrency:
  group: image-factory
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        image: [debian-13-golden, redos-8-server]
    steps:
      - uses: actions/checkout@v4
      - name: Validate & Build
        run: ./scripts/validate-build.sh "${{ matrix.image }}"
      - name: Publish
        run: ./scripts/publish.sh "${{ matrix.image }}" "${{ matrix.image }}/output/${{ matrix.image }}.qcow2"
